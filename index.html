<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Departures">
  <meta name="description" content="Upcoming departures for bus routes 59A and 14A in Margareten, Vienna.">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="./manifest.webmanifest?v=28">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=28">
  <title>59A &amp; 14A Departures</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea; --surface: rgba(255,255,255,.78); --text: #172026;
      --muted: #647078; --line: rgba(23,32,38,.11); --blue: #0067b1;
      --danger:#95504c; --danger-bg:#f4e2df; --warning:#855000; --warning-bg:rgba(226,151,31,.18);
      --warning-icon-bg:#955800; --warning-icon:#ffd89a;
      --shadow: 0 18px 50px rgba(35,30,24,.10); --radius: 24px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101416; --surface:rgba(29,35,38,.82); --text:#f4f2ec;
        --muted:#9ba5aa; --line:rgba(255,255,255,.11); --danger-bg:rgba(149,80,76,.24);
        --warning:#f2bd66; --warning-bg:rgba(226,151,31,.20);
        --warning-icon-bg:#a86200; --warning-icon:#ffe0ad; --shadow:0 20px 50px rgba(0,0,0,.28); }
    }
    * { box-sizing: border-box; }
    [hidden] { display:none!important; }
    html { background: var(--bg); }
    body { margin:0; min-height:100dvh; color:var(--text); background:
      radial-gradient(circle at 90% -10%, rgba(0,103,177,.16), transparent 36%), var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased; }
    button { font:inherit; }
    .app { width:min(100%, 600px); min-height:100dvh; margin:auto; padding:
      max(20px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:8px 2px 28px; }
    .brand { display:flex; align-items:flex-start; gap:13px; min-width:0; }
    .header-actions { display:flex; flex:0 0 48px; flex-direction:column; align-items:center; gap:5px; }
    .app-mark { flex:0 0 50px; width:50px; height:50px; border-radius:14px;
      box-shadow:0 10px 25px rgba(0,83,190,.24); }
    h1 { margin:0; font-size:clamp(23px,7vw,31px); letter-spacing:-.035em; line-height:1.05; }
    .route-tags { display:flex; gap:5px; margin-top:6px; }
    .route-tag { display:inline-grid; place-items:center; min-width:34px; height:20px; padding:0 7px;
      border-radius:6px; background:var(--blue); color:#fff; font-family:Arial,Helvetica,sans-serif;
      font-size:11px; font-weight:800; letter-spacing:-.2px; }
    .station { margin:5px 0 0; color:var(--muted); font-size:13px; line-height:1.3; }
    .refresh { position:relative; display:grid; width:48px; height:48px; padding:0; place-items:center;
      border:0; border-radius:16px; color:var(--text);
      background:var(--surface); box-shadow:var(--shadow); cursor:pointer; touch-action:manipulation;
      transition:background-color .35s ease, color .35s ease, box-shadow .35s ease, transform .18s ease; }
    .refresh:active { transform:scale(.96); }
    .refresh[disabled] { opacity:.55; }
    .refresh-spinner { display:grid; width:21px; height:21px; margin:auto; place-items:center;
      opacity:1; transform-origin:center; transition:opacity .28s ease; }
    .refresh-spinner svg { display:block; width:21px; height:21px; }
    .refresh.loading .refresh-spinner { animation:spin .8s linear infinite; will-change:transform; }
    .refresh::after { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
      font-size:23px; font-weight:800; transform:scale(.65); transition:opacity .28s ease, transform .35s ease; }
    .refresh.success { color:var(--text); background:var(--surface); box-shadow:var(--shadow); }
    .refresh.success .refresh-spinner, .refresh.failed .refresh-spinner { opacity:0; }
    .refresh.success::after { content:'✓'; opacity:1; transform:scale(1); }
    .refresh.failed { color:var(--danger); background:var(--danger-bg); box-shadow:0 10px 25px rgba(149,80,76,.13); }
    .refresh.failed::after { content:'!'; opacity:1; transform:scale(1); }
    .updated { width:48px; color:var(--muted); font-size:9px; line-height:1.2; text-align:center; }
    .updated:empty { display:none; }
    @media (prefers-color-scheme: dark) {
      .refresh.failed { color:#efc1bd; background:#553330; }
    }
    @keyframes spin { from { transform:rotate(0turn); } to { transform:rotate(-1turn); } }
    .notice { display:none; margin:0 0 16px; padding:12px 14px; border-radius:15px;
      font-size:13px; line-height:1.35; background:var(--danger-bg); color:var(--text); }
    .notice.visible { display:block; }
    .notice.offline { background:var(--warning-bg); }
    .access-card { padding:20px; border:1px solid var(--line); border-radius:var(--radius);
      background:var(--surface); box-shadow:var(--shadow); backdrop-filter:blur(18px); }
    .access-title { margin:0; font-size:20px; letter-spacing:-.025em; }
    .access-copy { margin:7px 0 16px; color:var(--muted); font-size:13px; line-height:1.4; }
    .access-form { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
    .access-input { min-width:0; height:44px; padding:0 13px; border:1px solid var(--line);
      border-radius:13px; outline:none; color:var(--text); background:var(--bg); font:inherit; }
    .access-input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,103,177,.14); }
    .access-submit { height:44px; padding:0 16px; border:1px solid var(--line); border-radius:13px;
      color:var(--text); background:var(--bg); font-weight:700; cursor:pointer; touch-action:manipulation; }
    .access-submit:active { transform:scale(.98); }
    .access-error { margin:12px 0 0; color:var(--danger); font-size:12px; line-height:1.35; }
    .board { display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:var(--radius);
      background:var(--surface); box-shadow:var(--shadow); backdrop-filter:blur(18px); }
    .card-head { padding:12px 12px 10px; border-bottom:1px solid var(--line); }
    .direction { display:flex; align-items:center; gap:9px; min-width:0; }
    .line-badge { display:grid; place-items:center; flex:0 0 42px; height:29px; border-radius:5px;
      background:var(--blue); color:#fff; font-family:Arial,Helvetica,sans-serif; font-size:15px;
      font-weight:800; letter-spacing:-.4px; }
    .direction-text { min-width:0; }
    .eyebrow { display:block; overflow:hidden; margin-bottom:2px; color:var(--muted); font-size:9px;
      font-weight:750; letter-spacing:.04em; text-overflow:ellipsis; text-transform:uppercase; white-space:nowrap; }
    h2 { overflow:hidden; margin:0; font-size:15px; letter-spacing:-.025em;
      text-overflow:ellipsis; white-space:nowrap; }
    .departures { list-style:none; margin:0; padding:2px 12px 5px; }
    .departure { display:grid; grid-template-columns:minmax(3.5rem,1fr) minmax(0,auto) minmax(3.5rem,1fr); align-items:center; gap:8px;
      min-height:51px; border-bottom:1px solid var(--line); }
    .departure:last-child { border-bottom:0; }
    .time { grid-column:1; font-size:14px; font-variant-numeric:tabular-nums; }
    .destination-tag { grid-column:2; display:flex; align-items:center; justify-self:center; gap:4px;
      overflow:hidden; max-width:100%; padding:4px 7px; border-radius:7px; color:var(--warning);
      background:var(--warning-bg); font-size:9px; font-weight:750; line-height:1.15; white-space:nowrap; }
    .destination-alert { display:block; flex:0 0 14px; width:14px; height:14px; }
    .destination-alert svg { display:block; width:100%; height:100%; }
    .destination-alert-triangle { fill:var(--warning-icon-bg); }
    .destination-alert-mark { fill:var(--warning-icon); }
    .destination-name { overflow:hidden; text-overflow:ellipsis; }
    .minutes { grid-column:3; justify-self:end; font-size:21px; font-weight:820; letter-spacing:-.035em;
      font-variant-numeric:tabular-nums; white-space:nowrap; }
    .minutes small { margin-left:2px; color:var(--muted); font-size:9px; font-weight:650; letter-spacing:0; }
    .minutes.now { color:var(--text); font-size:15px; }
    .state { min-height:104px; display:grid; place-items:center; padding:18px 12px; color:var(--muted);
      text-align:center; font-size:11px; line-height:1.4; }
    .skeleton { width:100%; }
    .skeleton span { display:block; height:16px; margin:15px 0; border-radius:10px;
      background:linear-gradient(90deg,var(--line),rgba(255,255,255,.14),var(--line));
      background-size:220% 100%; animation:shimmer 1.3s infinite; }
    @keyframes shimmer { to { background-position:-220% 0; } }
    @media (min-width:700px) {
      .app { padding-top:42px; }
      .board { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <img class="app-mark" src="./icons/icon-192.png?v=28" alt="">
        <div>
          <h1>Next departures</h1>
          <div class="route-tags" aria-label="Routes 59A and 14A"><span class="route-tag">59A</span><span class="route-tag">14A</span></div>
          <p class="station">Arbeitergasse &amp; Bacherplatz</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="refresh" id="refresh" type="button" aria-label="Refresh departures">
          <span class="refresh-spinner" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8.1 8.1 0 0 0-15.5-3M4 4v4h4M4 13a8.1 8.1 0 0 0 15.5 3M20 20v-4h-4"/></svg></span>
        </button>
        <span class="updated" id="updated"></span>
      </div>
    </header>
    <div class="notice" id="notice" role="status"></div>
    <section class="access-card" id="access-panel">
      <h2 class="access-title">Access required</h2>
      <p class="access-copy">Enter the shared access key once. It is saved in this browser after a successful connection.</p>
      <form class="access-form" id="access-form">
        <input class="access-input" id="access-key" type="password" placeholder="Access key" aria-label="Access key" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="256" required>
        <button class="access-submit" type="submit">Connect</button>
      </form>
      <p class="access-error" id="access-error" role="alert" hidden></p>
    </section>
    <section class="board" id="board" hidden></section>
  </main>

  <script>
    // Local development uses dev-server.py. Set this to the deployed Worker URL for GitHub Pages.
    const APP_VERSION = 'v28';
    const PRODUCTION_API_BASE_URL = 'https://vienna-bus-departures.woiki.workers.dev/monitor';
    const ACCESS_KEY_STORAGE_KEY = 'vienna-bus-departures-access-key';
    const LOCAL_HOSTS = new Set(['localhost', '127.0.0.1']);
    const API_BASE_URL = LOCAL_HOSTS.has(location.hostname)
      ? `${location.origin}/api/monitor`
      : PRODUCTION_API_BASE_URL;

    const CONFIG = Object.freeze({
      journeys: Object.freeze([
        { line:'59A', stopId:'1687', match:'Meidling', label:'Bhf. Meidling', station:'Arbeitergasse' },
        { line:'59A', stopId:'1698', match:'Karlsplatz', label:'Oper, Karlsplatz', station:'Arbeitergasse' },
        { line:'14A', stopId:'754', match:'Reumannplatz', label:'Reumannplatz', station:'Arbeitergasse' },
        { line:'14A', stopId:'1699', match:'Neubaugasse', label:'Neubaugasse', station:'Bacherplatz' }
      ].map(Object.freeze)),
      refreshMs: 20_000,
      maxDepartures: 2,
      maxDataAgeMs: 60_000,
      requestTimeoutMs: 10_000,
      minRefreshIndicatorMs: 1_500,
      maxAccessKeyLength: 256
    });
    const CLOCK_FORMATTER = new Intl.DateTimeFormat('en-GB', {
      hour:'2-digit', minute:'2-digit', hourCycle:'h23', timeZone:'Europe/Vienna'
    });
    const board = document.querySelector('#board');
    const notice = document.querySelector('#notice');
    const accessPanel = document.querySelector('#access-panel');
    const accessForm = document.querySelector('#access-form');
    const accessKeyInput = document.querySelector('#access-key');
    const accessError = document.querySelector('#access-error');
    const updated = document.querySelector('#updated');
    const refreshButton = document.querySelector('#refresh');
    let accessKey = readStoredAccessKey();
    let busy = false;
    let dataTimestamp = 0;
    let feedbackTimer;
    let autoRefreshTimer;
    let staleDataTimer;
    let activeRequestController;

    class AccessKeyError extends Error {}

    function normalizeAccessKey(value) {
      const key = String(value ?? '').trim();
      return key.length <= CONFIG.maxAccessKeyLength && /^[!-~]+$/u.test(key) ? key : '';
    }
    function readStoredAccessKey() {
      try {
        return normalizeAccessKey(localStorage.getItem(ACCESS_KEY_STORAGE_KEY));
      } catch {
        return '';
      }
    }
    function storeAccessKey(value) {
      try {
        localStorage.setItem(ACCESS_KEY_STORAGE_KEY, value);
      } catch {}
    }
    function removeStoredAccessKey() {
      try {
        localStorage.removeItem(ACCESS_KEY_STORAGE_KEY);
      } catch {}
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function formatClock(value) {
      if (!value) return '–';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '–';
      return CLOCK_FORMATTER.format(date);
    }
    function destinationMatches(value, expectedPart) {
      return String(value ?? '').toLocaleLowerCase('de-AT').includes(expectedPart.toLocaleLowerCase('de-AT'));
    }
    function formatDestinationLabel(value) {
      return String(value ?? '').trim().replace(/\s+(?:(?:S|U|Ⓢ|Ⓤ)\s*)+$/u, '').trim();
    }
    function renderCard(journey, body) {
      return `<article class="card"><div class="card-head"><div class="direction"><span class="line-badge">${esc(journey.line)}</span><div class="direction-text"><span class="eyebrow">${esc(journey.station)} · to</span><h2>${esc(journey.label)}</h2></div></div></div>${body}</article>`;
    }
    function render(data) {
      board.innerHTML = CONFIG.journeys.map(journey => {
        const departures = data
          .filter(item => item.stopId === journey.stopId && item.line === journey.line)
          .sort((a, b) => a.countdown - b.countdown)
          .slice(0, CONFIG.maxDepartures);
        const body = departures.length ? `<ul class="departures">${departures.map(item => {
          const mins = item.countdown;
          const destinationLabel = formatDestinationLabel(item.vehicleTowards);
          const alternateDestination = destinationLabel && !destinationMatches(item.vehicleTowards, journey.match)
            ? `<span class="destination-tag" title="To ${esc(destinationLabel)}"><span class="destination-alert" aria-hidden="true"><svg viewBox="0 0 14 14"><path class="destination-alert-triangle" d="M7 1.1c.42 0 .8.23 1.02.61l5.18 9.08c.44.77-.11 1.71-1.02 1.71H1.82c-.91 0-1.46-.94-1.02-1.71l5.18-9.08C6.2 1.33 6.58 1.1 7 1.1Z"/><rect class="destination-alert-mark" x="6.35" y="4.25" width="1.3" height="4.35" rx=".65"/><circle class="destination-alert-mark" cx="7" cy="10.35" r=".75"/></svg></span><span class="destination-name">To ${esc(destinationLabel)}</span></span>`
            : '';
          return `<li class="departure"><div class="time">${esc(formatClock(item.time))}</div>${alternateDestination}<div class="minutes ${mins <= 1 ? 'now' : ''}">${mins <= 1 ? 'now' : `${mins}<small>min</small>`}</div></li>`;
        }).join('')}</ul>` : '<div class="state">No departures in the next 60 minutes.</div>';
        return renderCard(journey, body);
      }).join('');
      setNotice('');
    }
    function renderLoading() {
      board.innerHTML = CONFIG.journeys.map(journey => renderCard(journey,
        '<div class="state"><div class="skeleton"><span></span><span></span></div></div>'
      )).join('');
    }
    function setNotice(message, offline = false) {
      notice.textContent = message;
      notice.className = `notice${message ? ' visible' : ''}${offline ? ' offline' : ''}`;
    }
    function setUpdatedTimestamp(value = 0) {
      const time = value ? formatClock(value) : '';
      updated.textContent = time;
      updated.setAttribute('aria-label', time ? `Updated ${time}` : '');
    }
    function showAccessPanel(message = '') {
      cancelAutoRefresh();
      cancelStaleDataTimer();
      activeRequestController?.abort();
      accessKey = '';
      dataTimestamp = 0;
      setUpdatedTimestamp();
      accessKeyInput.value = '';
      accessError.textContent = message;
      accessError.hidden = !message;
      accessPanel.hidden = false;
      board.hidden = true;
      refreshButton.disabled = true;
      resetRefreshFeedback();
      refreshButton.classList.remove('loading');
      refreshButton.setAttribute('aria-label', 'Enter access key first');
      setNotice('');
    }
    function showDeparturesInterface() {
      accessError.textContent = '';
      accessError.hidden = true;
      accessPanel.hidden = true;
      board.hidden = false;
      refreshButton.disabled = false;
      refreshButton.setAttribute('aria-label', 'Refresh departures');
      renderLoading();
    }
    function renderFailure() {
      dataTimestamp = 0;
      cancelStaleDataTimer();
      setUpdatedTimestamp();
      renderLoading();
      setNotice(navigator.onLine ? '' : 'You are offline.', !navigator.onLine);
    }
    function resetRefreshFeedback() {
      clearTimeout(feedbackTimer);
      refreshButton.classList.remove('success', 'failed');
      refreshButton.setAttribute('aria-label', 'Refresh departures');
    }
    function showRefreshFeedback(succeeded) {
      resetRefreshFeedback();
      refreshButton.classList.add(succeeded ? 'success' : 'failed');
      refreshButton.setAttribute('aria-label', succeeded ? 'Successfully refreshed' : 'Refresh failed');
      feedbackTimer = setTimeout(resetRefreshFeedback, succeeded ? 1400 : 1800);
    }
    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }
    function validDateValue(value) {
      return typeof value === 'string' && Number.isFinite(Date.parse(value)) ? value : '';
    }
    function validApiPayload(payload) {
      return payload?.message?.messageCode === 1 && Array.isArray(payload?.data?.monitors);
    }
    function normalize(payload) {
      const departures = [];
      for (const monitor of asArray(payload?.data?.monitors)) {
        const stopId = String(monitor?.locationStop?.properties?.attributes?.rbl ?? '').trim();
        for (const line of asArray(monitor?.lines)) {
          const lineName = String(line?.name ?? '').trim();
          for (const departure of asArray(line?.departures?.departure)) {
            const departureTime = departure?.departureTime;
            const rawCountdown = departureTime?.countdown;
            const countdown = typeof rawCountdown === 'number'
              || (typeof rawCountdown === 'string' && rawCountdown.trim())
              ? Number(rawCountdown) : NaN;
            const time = validDateValue(departureTime?.timeReal)
              || validDateValue(departureTime?.timePlanned);
            if (!stopId || !lineName || !time || !Number.isFinite(countdown) || countdown < 0 || countdown > 60) continue;
            departures.push({
              stopId,
              line:lineName,
              vehicleTowards:String(departure?.vehicle?.towards ?? line?.towards ?? '').trim(),
              countdown,
              time
            });
          }
        }
      }
      return departures;
    }
    function dataIsStale(now = Date.now()) {
      return !dataTimestamp || now - dataTimestamp >= CONFIG.maxDataAgeMs;
    }
    function appIsActive() {
      return !document.hidden && (document.hasFocus?.() ?? true);
    }
    function cancelStaleDataTimer() {
      clearTimeout(staleDataTimer);
      staleDataTimer = undefined;
    }
    function scheduleStaleDataExpiry() {
      cancelStaleDataTimer();
      if (!dataTimestamp || !appIsActive()) return;
      const remaining = Math.max(0, dataTimestamp + CONFIG.maxDataAgeMs - Date.now());
      staleDataTimer = setTimeout(() => {
        staleDataTimer = undefined;
        if (dataIsStale()) renderFailure();
      }, remaining + 25);
    }
    async function loadDepartures({ initial = false, manual = false } = {}) {
      let outcome = '';
      if (!accessKey) return;
      if (dataTimestamp && dataIsStale()) renderFailure();
      if (busy || !appIsActive() || !navigator.onLine) {
        if (!navigator.onLine && dataIsStale()) renderFailure();
        else if (!navigator.onLine) setNotice('You are offline.', true);
        if (manual && !navigator.onLine) showRefreshFeedback(false);
        return;
      }
      busy = true;
      resetRefreshFeedback();
      board.setAttribute('aria-busy', 'true');
      refreshButton.disabled = true;
      if (!initial) {
        refreshButton.classList.add('loading');
        refreshButton.setAttribute('aria-label', 'Refreshing departures');
      }
      const refreshStartedAt = initial ? 0 : performance.now();
      const controller = new AbortController();
      activeRequestController = controller;
      const timeout = setTimeout(() => controller.abort(), CONFIG.requestTimeoutMs);
      try {
        const stopIds = [...new Set(CONFIG.journeys.map(journey => journey.stopId))];
        const query = stopIds.map(id => `stopId=${encodeURIComponent(id)}`).join('&');
        const response = await fetch(`${API_BASE_URL}?${query}`, {
          headers: { Accept:'application/json', Authorization:`Bearer ${accessKey}` },
          cache: 'no-store',
          signal: controller.signal
        });
        if (controller.signal.aborted || !appIsActive()) return;
        if (response.status === 401) throw new AccessKeyError();
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (controller.signal.aborted || !appIsActive()) return;
        if (!validApiPayload(payload)) throw new Error('Invalid API response');
        const data = normalize(payload);
        dataTimestamp = Date.now();
        storeAccessKey(accessKey);
        render(data); setUpdatedTimestamp(dataTimestamp);
        scheduleStaleDataExpiry();
        outcome = 'success';
      } catch (error) {
        if (!appIsActive()) return;
        outcome = error instanceof AccessKeyError ? 'unauthorized' : 'failed';
        if (outcome === 'unauthorized') setNotice('');
        else if (dataIsStale()) renderFailure();
        else setNotice(navigator.onLine ? '' : 'You are offline.', !navigator.onLine);
      } finally {
        clearTimeout(timeout);
        if (!initial && !controller.signal.aborted) {
          const indicatorDelay = CONFIG.minRefreshIndicatorMs - (performance.now() - refreshStartedAt);
          if (indicatorDelay > 0) await new Promise(resolve => {
            const timer = setTimeout(finish, indicatorDelay);
            function finish() {
              clearTimeout(timer);
              controller.signal.removeEventListener('abort', finish);
              resolve();
            }
            controller.signal.addEventListener('abort', finish, { once:true });
          });
        }
        if (activeRequestController === controller) activeRequestController = undefined;
        busy = false;
        board.setAttribute('aria-busy', 'false');
        refreshButton.disabled = false;
        refreshButton.classList.remove('loading');
        refreshButton.setAttribute('aria-label', 'Refresh departures');
        if (outcome === 'unauthorized') {
          removeStoredAccessKey();
          showAccessPanel('The access key is incorrect.');
          return;
        }
        requestAnimationFrame(() => {
          if (!appIsActive() || busy || !accessKey) return;
          if (outcome === 'success' && !initial) showRefreshFeedback(true);
          else if (outcome === 'failed' && manual) showRefreshFeedback(false);
        });
      }
    }
    accessForm.addEventListener('submit', event => {
      event.preventDefault();
      const candidate = normalizeAccessKey(accessKeyInput.value);
      if (!candidate) {
        accessError.textContent = 'Use printable ASCII characters without spaces (maximum 256).';
        accessError.hidden = false;
        return;
      }
      accessKey = candidate;
      accessKeyInput.value = '';
      showDeparturesInterface();
      void refreshAndSchedule({ initial:true });
    });
    refreshButton.addEventListener('click', () => {
      void refreshAndSchedule({ manual:true });
    });
    window.addEventListener('online', () => {
      setNotice('');
      if (appIsActive()) void refreshAndSchedule();
    });
    window.addEventListener('offline', () => {
      cancelAutoRefresh();
      activeRequestController?.abort();
      if (dataIsStale()) renderFailure();
      else setNotice('You are offline.', true);
    });
    function pauseBackgroundWork() {
      cancelAutoRefresh();
      cancelStaleDataTimer();
      activeRequestController?.abort();
      resetRefreshFeedback();
    }
    function resumeForegroundWork() {
      if (!appIsActive()) {
        pauseBackgroundWork();
        return;
      }
      scheduleStaleDataExpiry();
      if (navigator.onLine) void refreshAndSchedule();
      else if (dataIsStale()) renderFailure();
      else setNotice('You are offline.', true);
    }
    document.addEventListener('visibilitychange', resumeForegroundWork);
    window.addEventListener('focus', resumeForegroundWork);
    window.addEventListener('blur', pauseBackgroundWork);
    window.addEventListener('pagehide', pauseBackgroundWork);
    window.addEventListener('pageshow', event => {
      if (event.persisted) resumeForegroundWork();
    });
    function getWorkerVersion(worker) {
      if (!worker) return Promise.resolve(null);
      return new Promise(resolve => {
        const channel = new MessageChannel();
        function finish(version = null) {
          clearTimeout(timeout);
          channel.port1.close();
          channel.port2.close();
          resolve(version);
        }
        const timeout = setTimeout(finish, 1_000);
        channel.port1.onmessage = event => finish(event.data?.version ?? null);
        try {
          worker.postMessage({ type:'GET_VERSION' }, [channel.port2]);
        } catch {
          finish();
        }
      });
    }
    function cancelAutoRefresh() {
      clearTimeout(autoRefreshTimer);
      autoRefreshTimer = undefined;
    }
    function scheduleAutoRefresh() {
      cancelAutoRefresh();
      if (busy || !accessKey || !appIsActive() || !navigator.onLine) return;
      autoRefreshTimer = setTimeout(() => {
        autoRefreshTimer = undefined;
        void refreshAndSchedule();
      }, CONFIG.refreshMs);
    }
    async function refreshAndSchedule(options = {}) {
      if (busy) return;
      cancelAutoRefresh();
      try {
        await loadDepartures(options);
      } finally {
        scheduleAutoRefresh();
      }
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        if (LOCAL_HOSTS.has(location.hostname)) {
          // Keep local development independent of previously cached releases.
          navigator.serviceWorker.getRegistration().then(async registration => {
            const scriptUrl = new URL('./service-worker.js', location.href).href;
            if (registration?.active?.scriptURL !== scriptUrl) return;
            await registration.unregister();
            const keys = await caches.keys();
            await Promise.all(keys.filter(key => key.startsWith('vienna-bus-departures-'))
              .map(key => caches.delete(key)));
            if (navigator.serviceWorker.controller) location.reload();
          }).catch(() => {});
          return;
        }
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloadingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', async () => {
          if (!hadController || reloadingForUpdate) return;
          const workerVersion = await getWorkerVersion(navigator.serviceWorker.controller);
          if (!workerVersion || workerVersion === APP_VERSION) return;
          reloadingForUpdate = true;
          location.reload();
        });
        navigator.serviceWorker.register('./service-worker.js', { updateViaCache:'none' })
          .catch(() => {});
      });
    }
    if (accessKey) {
      showDeparturesInterface();
      void refreshAndSchedule({ initial:true });
    } else {
      showAccessPanel();
    }
  </script>
</body>
</html>
